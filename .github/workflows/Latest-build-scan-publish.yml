name: React Build Scan Publish

on:
  workflow_dispatch:

  push:
    branches:
      - feature/react
      - develop

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: write
  packages: write

env:
  IMAGE_NAME: react-webapp

jobs:

  ####################################################
  # Build & Push
  ####################################################

  build:

    runs-on: react-build-runner

    container:
      image: ghcr.io/<org>/maven-kaniko:<tag>

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: tag
        run: |
          echo "image_tag=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Create ACR Auth Config
        run: |

          mkdir -p /kaniko/.docker

          AUTH=$(echo -n "${{ secrets.AZURE_CLIENT_ID }}:${{ secrets.AZURE_CLIENT_SECRET }}" | base64 -w 0)

          cat > /kaniko/.docker/config.json <<EOF
          {
            "auths": {
              "${{ secrets.ACR_LOGIN_SERVER }}": {
                "auth": "${AUTH}"
              }
            }
          }
          EOF

      - name: Build And Push
        run: |
          /kaniko/executor \
            --context="${GITHUB_WORKSPACE}" \
            --dockerfile="${GITHUB_WORKSPACE}/Dockerfile" \
            --destination="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}" \
            --oci-layout-path=/kaniko/oci-layout

      - name: Build Summary
        run: |
          echo "Image Pushed:"
          echo "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}"

  ####################################################
  # Wiz Scan
  ####################################################

  wiz-scan:

    needs: build

    runs-on: wiz-scan-runner

    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login To GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Run Wiz Scan
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
          WIZ_CNTR_POLICY: "default vuln policy"

        run: |

          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"

          echo "Scanning image:"
          echo "$IMAGE"

          chmod +x .github/scripts/run_wiz-scan.sh

          bash .github/scripts/run_wiz-scan.sh \
            "$IMAGE" \
            "$GITHUB_WORKSPACE/Dockerfile" \
            "$GITHUB_WORKSPACE"

      - name: Upload SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
