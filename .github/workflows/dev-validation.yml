name: Dev Validation

on:
  push:
    branches:
      - feature/*
      - develop

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

env:
  NODE_VERSION: "24"

jobs:

  validate:

    runs-on: xyz-abc-ddd

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm ci

      - name: Build React Application
        run: npm run build

      - name: Verify Dist Folder
        run: |
          ls -la dist

      - name: Verify Dockerfile
        run: |
          test -f Dockerfile

      - name: Verify Nginx Config
        run: |
          test -f nginx.conf

      - name: Success
        run: |
          echo "React build validation completed successfully"
